<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Curibot is a conversational AI assistant that remembers your conversations."
    />
    <title>Curibot</title>
    <script>
      // Apply a saved theme before first paint to avoid a flash of the
      // other theme. Keep the key in sync with src/useTheme.ts.
      try {
        const theme = localStorage.getItem("curibot-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Fall back to the system theme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
