services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: conversation_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d conversation_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/conversation_agent
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-16000}
      # Optional: web search is disabled when the key is empty.
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_MAX_ROUNDS: ${WEB_SEARCH_MAX_ROUNDS:-3}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # Optional LangSmith tracing. Traces include message content.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-curibot}
      # EU accounts: https://eu.api.smith.langchain.com. Empty uses the US API.
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      # Only for service keys (lsv2_sk_) scoped to several workspaces.
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    # Serve the live source so edits hot-reload instead of needing a rebuild.
    # The anonymous volume keeps the image's Linux node_modules, since the
    # host's may contain macOS builds of native tools.
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: